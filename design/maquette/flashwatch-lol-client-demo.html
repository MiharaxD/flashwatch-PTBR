<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashwatch — prévia do overlay</title>
<style>
  :root{color-scheme:dark;--panel:rgba(14,16,22,.44);--edge:rgba(184,205,220,.2);--green:#79e08e;--amber:#f0c54e;--red:#ff6863;--cyan:#60cddd;}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#090f14}
  body{min-height:100vh;display:grid;place-items:center;font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
  .screen{width:min(1200px,100vw);height:min(760px,100vh);min-height:420px;position:relative;overflow:hidden;background:
    radial-gradient(ellipse at 80% 15%,#68744d3a 0 7%,transparent 22%),
    radial-gradient(ellipse at 76% 72%,#72774a38 0 8%,transparent 24%),
    radial-gradient(ellipse at 38% 58%,#47594465 0 14%,transparent 32%),
    linear-gradient(137deg,#252d31 0%,#172024 34%,#252a28 65%,#151c20 100%);}
  .screen:before{content:"";position:absolute;inset:-10%;opacity:.43;background:
    repeating-linear-gradient(31deg,transparent 0 42px,#c1b78b0b 43px 45px,transparent 46px 82px),
    repeating-linear-gradient(121deg,transparent 0 61px,#06101266 62px 74px,transparent 75px 112px),
    radial-gradient(ellipse at 25% 35%,#89907830,transparent 27%),
    radial-gradient(ellipse at 84% 47%,#8c8a6631,transparent 29%);}
  .river{position:absolute;inset:-3%;opacity:.42;background:#283b3d;clip-path:polygon(44% 0,52% 0,57% 13%,54% 25%,62% 36%,60% 48%,68% 61%,64% 73%,71% 86%,67% 100%,54% 100%,59% 85%,52% 74%,57% 62%,49% 50%,54% 38%,46% 26%,50% 13%);filter:blur(7px)}
  .lane{position:absolute;width:135%;height:90px;border-top:2px solid #d0c59a21;border-bottom:2px solid #03080945;transform:rotate(-31deg);left:-14%;top:52%;border-radius:50%;box-shadow:0 -10px 0 #1219194d,0 12px 0 #85816a18}
  .lane.two{top:16%;left:4%;transform:rotate(33deg);height:64px;opacity:.6}
  .bush{position:absolute;width:170px;height:120px;border-radius:50%;background:radial-gradient(ellipse,#55654a 0 18%,#293b31 45%,transparent 70%);filter:blur(3px);opacity:.66}
  .bush.a{right:10%;top:7%}.bush.b{right:22%;bottom:5%;transform:scale(1.2)}.bush.c{left:37%;top:46%;transform:scale(.8)}
  .stone{position:absolute;width:62px;height:62px;border:2px solid #aca48033;border-radius:50%;box-shadow:inset 0 0 0 7px #1e252553,0 0 18px #060a0b80;opacity:.55}
  .stone.a{right:24%;top:23%}.stone.b{right:13%;bottom:16%;width:88px;height:88px}.stone.c{left:40%;top:20%;width:44px;height:44px}
  .mist{position:absolute;inset:0;background:linear-gradient(90deg,#05090c4a,transparent 42%,#05080a26),linear-gradient(0deg,#02040545,transparent 25%,#02040525);pointer-events:none}
  .overlay{position:absolute;left:clamp(14px,5.2vw,66px);top:clamp(12px,3vh,24px);width:156px;padding:7px 6px 9px;border:1px solid var(--edge);border-radius:8px;background:var(--panel);box-shadow:0 8px 26px #0005;backdrop-filter:blur(1.5px)}
  .champ-card{height:120px;position:relative;display:flex;flex-direction:column;align-items:center;padding-top:4px}
  .champion{width:40px;height:40px;object-fit:cover;border-radius:50%;border:1px solid #93a9b2a8;box-shadow:0 1px 6px #0009;display:block}
  .spells{display:flex;justify-content:center;gap:7px;margin-top:7px}
  .spell{width:24px;height:24px;position:relative;border-radius:50%;overflow:visible;flex:none}
  .spell img{display:block;width:24px;height:24px;object-fit:cover;border-radius:50%;border:1px solid #8bb0b896;box-shadow:0 1px 4px #000a}
  .spell.cooling img{filter:grayscale(.68) brightness(.76)}
  .spell.cooling:after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(45deg,transparent 42%,#05090a 45% 49%,#e4edf0 49.5% 52%,#05090a 53% 56%,transparent 59%),linear-gradient(-45deg,transparent 42%,#05090a 45% 49%,#e4edf0 49.5% 52%,#05090a 53% 56%,transparent 59%);pointer-events:none}
  .spell.cooling:before{content:"";position:absolute;z-index:2;inset:0;border:1px solid #59cad4;border-radius:50%;pointer-events:none}
  .time{height:13px;margin-top:1px;min-width:38px;text-align:center;font:700 11px/13px "Segoe UI",system-ui,sans-serif;letter-spacing:-.02em;color:var(--green);text-shadow:0 1px 2px #000,0 0 5px #000}
  .time.mid{color:var(--amber)}.time.near{color:var(--red)}.time.empty{visibility:hidden}
  .spell.expiring img{filter:grayscale(.8) brightness(.67)}
  .cooldown-cross{display:none}
  .scene-caption{position:absolute;right:18px;bottom:13px;padding:5px 8px;border:1px solid #d6d8d033;background:#08101566;color:#b0b9bd9c;font-size:8px;letter-spacing:.12em;text-transform:uppercase}
  @media(max-width:520px){.screen{height:100vh}.overlay{left:12px;top:10px;transform:scale(.94);transform-origin:top left}.scene-caption{right:8px;bottom:8px;font-size:7px}}
</style>
</head>
<body>
<main class="screen" aria-label="Prévia ilustrativa do overlay do Flashwatch durante uma partida">
  <div class="river"></div><div class="lane"></div><div class="lane two"></div>
  <div class="bush a"></div><div class="bush b"></div><div class="bush c"></div>
  <div class="stone a"></div><div class="stone b"></div><div class="stone c"></div><div class="mist"></div>
  <section class="overlay" aria-label="Cartões fixos de recarga">
    <article class="champ-card" aria-label="Ahri: Flash em recarga">
      <img class="champion" src="../../assets/cache/champions/Ahri.png" alt="">
      <div class="spells">
        <span class="spell"><img src="../../assets/cache/spells/AhriR.png" alt=""><span class="cooldown-cross"></span></span>
        <span class="spell cooling"><img src="../../assets/cache/spells/SummonerFlash.png" alt=""><span class="cooldown-cross"></span></span>
        <span class="spell"><img src="../../assets/cache/spells/SummonerHeal.png" alt=""><span class="cooldown-cross"></span></span>
      </div>
      <span class="time empty">0:00</span><span class="time mid" style="position:absolute;left:26px;top:72px">~0:45</span><span class="time empty">0:00</span>
    </article>
    <article class="champ-card" aria-label="Jinx: ultimate em recarga">
      <img class="champion" src="../../assets/cache/champions/Jinx.png" alt="">
      <div class="spells">
        <span class="spell cooling"><img src="../../assets/cache/spells/JinxR.png" alt=""><span class="cooldown-cross"></span></span>
        <span class="spell"><img src="../../assets/cache/spells/SummonerFlash.png" alt=""><span class="cooldown-cross"></span></span>
        <span class="spell"><img src="../../assets/cache/spells/SummonerHeal.png" alt=""><span class="cooldown-cross"></span></span>
      </div>
      <span class="time near" style="position:absolute;left:23px;top:72px">0:12</span><span class="time empty">0:00</span><span class="time empty">0:00</span>
    </article>
    <article class="champ-card" aria-label="Yasuo: Flash em recarga">
      <img class="champion" src="../../assets/cache/champions/Yasuo.png" alt="">
      <div class="spells">
        <span class="spell"><img src="../../assets/cache/spells/YasuoR.png" alt=""><span class="cooldown-cross"></span></span>
        <span class="spell cooling"><img src="../../assets/cache/spells/SummonerFlash.png" alt=""><span class="cooldown-cross"></span></span>
        <span class="spell"><img src="../../assets/cache/spells/SummonerDot.png" alt=""><span class="cooldown-cross"></span></span>
      </div>
      <span class="time empty">0:00</span><span class="time" style="position:absolute;left:59px;top:72px">1:53</span><span class="time empty">0:00</span>
    </article>
    <article class="champ-card" aria-label="Thresh: Flash em recarga">
      <img class="champion" src="../../assets/cache/champions/Thresh.png" alt="">
      <div class="spells">
        <span class="spell"><img src="../../assets/cache/spells/ThreshRPenta.png" alt=""><span class="cooldown-cross"></span></span>
        <span class="spell cooling"><img src="../../assets/cache/spells/SummonerFlash.png" alt=""><span class="cooldown-cross"></span></span>
        <span class="spell"><img src="../../assets/cache/spells/SummonerExhaust.png" alt=""><span class="cooldown-cross"></span></span>
      </div>
      <span class="time empty">0:00</span><span class="time" style="position:absolute;left:59px;top:72px">2:49</span><span class="time empty">0:00</span>
    </article>
  </section>
  <div class="scene-caption">prévia · cartões fixos · dados ilustrativos</div>
</main>
</body>
</html>
